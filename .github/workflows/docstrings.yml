name: Docstrings Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docstring-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7

      - name: Install dependencies
        run: |
          python -m pip install .[dev]
      
      - name: Run linter 
        run: |
          ruff check --select D src/
