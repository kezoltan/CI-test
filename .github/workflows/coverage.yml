name: Codecov

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  codecov-test:
    runs-on: macos-latest
    
    steps:
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: coverage.xml
