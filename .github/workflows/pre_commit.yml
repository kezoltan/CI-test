name: Added Hooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-pre-commit:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7


      - name: Setup python
        uses: actions/setup-python@v7

      - name: Install dependencies
        run: |
          python -m pip install .[dev]

      - name: Run hooks against all files
        run: |
          pre-commit run --all-files
